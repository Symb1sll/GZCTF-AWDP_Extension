name: gzctf-awdp-dev
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: awdp_dev
      POSTGRES_DB: gzctf_awdp_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run init.py first}
    volumes:
      - /srv/awdp-dev/postgres:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U awdp_dev -d gzctf_awdp_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1
  web:
    image: gzctf-awdp-dev:1.2.5-local
    build:
      context: ../..
      dockerfile: awdp/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:18091:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - /srv/awdp-dev/config/platform.json:/app/appsettings.json:ro
      - /srv/awdp-dev/files:/app/files
      - /srv/awdp-dev/data/submissions:/srv/awdp-dev/data/submissions
      - /srv/awdp-dev/queue/pending:/srv/awdp-dev/queue/pending
      - /srv/awdp-dev/queue/running:/srv/awdp-dev/queue/running:ro
      - /srv/awdp-dev/queue/results:/srv/awdp-dev/queue/results:ro
      - /srv/awdp-dev/queue/archive:/srv/awdp-dev/queue/archive:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [web-entry, control, challenges]
    mem_limit: 2g
    cpus: 2
networks:
  web-entry:
    driver: bridge
  control:
    internal: true
  challenges:
    name: gzctf-awdp-dev-challenges
    internal: true
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
